name: Asula
description: 'Asula is a Bitcoin company building the next generation of financial products at the
  intersection of bitcoin, blockchain infrastructure, and finance. The company is developing a mobile
  app that lets people buy, sell, and borrow against their Bitcoin, spanning a mobile wallet with
  seamless onboarding, cross-chain swaps, and a lending protocol. Asula has raised roughly $6.7M from
  Electric Capital, Framework Ventures, and Figment Capital, and ships two products, Bedlam and Dawn.
  As of July 2026 Asula publishes a minimal landing page and careers portal only, with no public
  developer API, SDK, OpenAPI, or documentation surface.'
